# Publishes the public site to GitHub Pages on every push.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#
# GitHub Pages only serves files, so this copy shows the catalog, course
# pages, shop, free courses and free previews. Member sign-in, locked
# lessons and the owner dashboard run on the Cloudflare server (see README).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/amazing-feynman-twb9iw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build course data from schema.sql + seed.sql
        run: node scripts/export-static.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
